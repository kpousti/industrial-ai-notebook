name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # run each case study's tests from inside its own folder
      - run: for d in case-studies/*/; do (cd "$d" && python -m pytest -q) || exit 1; done
